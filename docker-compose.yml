services:
  postgres:
    image: postgres:18
    container_name: garageos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dtsx
      POSTGRES_DB: GarageOS
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - garageos_pgdata:/var/lib/postgresql/18/docker
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: garageos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@garageos.com
      PGADMIN_DEFAULT_PASSWORD: dtsx
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  garageos_pgdata:
