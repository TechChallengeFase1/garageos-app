apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garageos-postgres
  namespace: garageos
spec:
  serviceName: garageos-postgres
  replicas: 1
  selector:
    matchLabels:
      app: garageos-postgres
  template:
    metadata:
      labels:
        app: garageos-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Credenciais do banco: providas pelo Terraform (garageos-db-config / garageos-db-secret)
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: garageos-db-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: garageos-db-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garageos-db-secret
                  key: POSTGRES_PASSWORD
            # Subdiretorio evita conflito com lost+found do volume montado
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "garageos", "-d", "garageos"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "garageos", "-d", "garageos"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: garageos-postgres-pvc
