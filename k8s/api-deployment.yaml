apiVersion: apps/v1
kind: Deployment
metadata:
  name: garageos-api
  namespace: garageos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: garageos-api
  template:
    metadata:
      labels:
        app: garageos-api
    spec:
      containers:
        - name: api
          # Imagem publicada no Docker Hub (usuario garageosfiap)
          image: garageosfiap/garageos-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # Injeta todas as chaves do ConfigMap e do Secret como variaveis de ambiente
          envFrom:
            - configMapRef:
                name: garageos-config
            - secretRef:
                name: garageos-secret
          # Probes HTTP de verdade, atendendo ao requisito "healthchecks e uptime".
          #
          # A separacao entre os dois endpoints e deliberada:
          #
          #   /health/ready  consulta o PostgreSQL. Se o banco cair, o pod sai
          #                  do balanceamento e volta sozinho quando o banco
          #                  voltar. Ninguem e reiniciado.
          #
          #   /health/live   NAO consulta o banco. Se consultasse, uma oscilacao
          #                  do RDS reprovaria a probe em TODOS os pods ao mesmo
          #                  tempo e o Kubernetes mataria a aplicacao inteira -
          #                  transformando instabilidade de banco em queda total.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # requests.cpu e obrigatorio para o HPA calcular a % de utilizacao
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
