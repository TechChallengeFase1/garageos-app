apiVersion: v1
kind: Service
metadata:
  name: garageos-api
  namespace: garageos
  annotations:
    # Network Load Balancer (camada 4) em vez do Classic Load Balancer, que e o
    # padrao herdado do EKS. Mais barato, sobe mais rapido, e o CLB esta em
    # caminho de descontinuacao na AWS.
    #
    # ATENCAO ao valor: "nlb" e provisionado pelo cloud controller manager que
    # ja vem no EKS. O valor "external" delega ao AWS Load Balancer Controller,
    # que e um add-on separado - se ele nao estiver instalado, o Service fica
    # em <pending> para sempre, parado em "Ensuring load balancer", sem erro.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  # LoadBalancer, e nao mais NodePort.
  #
  # O NodePort 30080 era heranca do kind, onde o cluster era um container e a
  # porta era mapeada para localhost. No EKS isso nao da URL nenhuma: os nos
  # tem IP publico, mas nada distribui trafego entre eles, e o IP muda quando o
  # no e substituido.
  #
  # Com LoadBalancer, a AWS provisiona um NLB de verdade e o Kubernetes escreve
  # o hostname dele em status.loadBalancer. E esse hostname que vira a URL da
  # API - e, na Fase 5, o destino do API Gateway.
  #
  # CUSTO: ~US$ 18/mes enquanto existir. O `terraform destroy` do cluster NAO o
  # remove, porque quem o criou foi o Kubernetes, nao o Terraform. Apague o
  # Service (ou o namespace) antes de destruir o cluster, senao o NLB fica
  # orfao cobrando - e como ele tem ENIs na VPC, tambem trava a destruicao.
  type: LoadBalancer

  # Preserva o IP de origem do cliente ate o pod. Sem isso todo request parece
  # vir do IP do no, e os logs perdem a origem real.
  externalTrafficPolicy: Local

  selector:
    app: garageos-api
  ports:
    - port: 80
      targetPort: 8080
      name: http
