name: CD

# Pipeline de entrega continua: build, testes e publicacao da imagem.
#
# ESTADO TRANSITORIO - migracao de kind local para AWS EKS (Fase 3).
#
# O job de deploy foi removido neste commit. Ele rodava `terraform apply` em
# `infra/`, pasta que saiu deste repositorio no PR #35 (a infraestrutura passou
# para garageos-infra-k8s e garageos-infra-database), e aplicava manifestos num
# cluster kind que so existia na maquina local - o runner do GitHub nunca teria
# esse cluster, e o smoke test em localhost:30080 nunca responderia.
#
# Divisao de responsabilidades (mantida):
#   - Terraform (repos de infra) entrega cluster vazio + banco vazio.
#   - Esta pipeline aplica os manifestos da APLICACAO (k8s/).
#
# O deploy sera reescrito quando o EKS existir, com:
#   - autenticacao na AWS via OIDC (sem access key estatica);
#   - `aws eks update-kubeconfig` para obter acesso ao cluster;
#   - manifestos de k8s/ com a tag da imagem deste commit (nao :latest);
#   - migrations do EF Core como Job, antes do rollout (com HPA, N pods
#     aplicando migration em paralelo vira corrida).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: garageosfiap/garageos-api

jobs:
  # 1) Build da aplicacao + 2) Execucao dos testes automatizados
  build-test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Code/GarageOS.slnx

      - name: Build da aplicacao
        run: dotnet build Code/GarageOS.slnx --configuration Release --no-restore

      - name: Testes unitarios
        run: dotnet test Code/GarageOS.UnitTests/GarageOS.UnitTests.csproj --configuration Release --no-build

      - name: Testes de integracao
        run: dotnet test Code/GarageOS.IntegrationTests/GarageOS.IntegrationTests.csproj --configuration Release --no-build

  # 3) Build da imagem Docker (e push para o Docker Hub)
  docker:
    name: Build e push da imagem Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
